<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude · RTL Chat (V2)</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e1e2e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2389b4fa'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #1e1e2e; --fg: #e6e6e6; --muted: #9a9ab0; --accent: #89b4fa;
    --code-bg: #181825; --border: #313244; --new: #a6e3a1;
    --user: #f5c2e7;   /* "you" — warm pink, clearly distinct from Claude's white */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "SF Hebrew", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    font-size: 17px; line-height: 1.7; direction: rtl; text-align: right;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    overscroll-behavior: none;            /* never let scroll trigger browser back/fwd */
  }
  /* header lives OUTSIDE the scroll area → it can never scroll away */
  header { flex: 0 0 auto; background: var(--code-bg); border-bottom: 1px solid var(--border); }
  #bar {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 16px; font-size: 13px; color: var(--muted);
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #f38ba8; transition: background .3s; }
  #dot.live { background: var(--new); }
  /* always-visible work-state pill — answers "is it working or done?" at a glance */
  #workState { font-weight: 600; padding: 2px 11px; border-radius: 12px; font-size: 12.5px; white-space: nowrap; }
  #workState.work { color: #f9e2af; background: rgba(249,226,175,.14); }
  #workState.ready { color: var(--new); background: rgba(166,227,161,.13); }
  #histBtn {
    margin-inline-start: auto; cursor: pointer; user-select: none;
    border: 1px solid var(--border); border-radius: 7px; padding: 3px 10px;
    color: var(--muted); background: var(--bg); font-size: 12px;
  }
  #histBtn.on { color: var(--fg); border-color: var(--accent); }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 0;
    overscroll-behavior-x: contain; scroll-behavior: smooth;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  /* slim, always-there strip scrollbar so horizontal scrolling is discoverable */
  #tabs::-webkit-scrollbar { height: 7px; }
  #tabs::-webkit-scrollbar-track { background: transparent; }
  #tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  #tabs::-webkit-scrollbar-thumb:hover { background: #45475a; }
  /* ‹ › arrows to scroll the tab strip with a click — shown only when it overflows */
  #tabStrip { position: relative; }
  /* subtle edge chevrons: a soft fade of the header bg with a small muted arrow,
     like a normal scrollable tab bar — brightens on hover */
  .tabArrow {
    position: absolute; top: 8px; bottom: 0; width: 38px; z-index: 5;
    display: none; align-items: center; border: none; cursor: pointer;
    color: var(--muted); font-size: 17px; line-height: 1; padding: 0 4px;
    transition: color .12s;
  }
  #tabArrowL { left: 0;  justify-content: flex-start;
    background: linear-gradient(to right, var(--code-bg) 38%, transparent); }
  #tabArrowR { right: 0; justify-content: flex-end;
    background: linear-gradient(to left, var(--code-bg) 38%, transparent); }
  .tabArrow:hover { color: var(--fg); }
  #tabStrip.canL #tabArrowL { display: flex; }
  #tabStrip.canR #tabArrowR { display: flex; }
  .tab, #histBtn, #content details.tool > summary, #content a { cursor: pointer; }
  .tab {
    flex: 0 0 auto; cursor: pointer; user-select: none;
    padding: 6px 13px 8px; border: 1px solid var(--border); border-bottom: none;
    border-radius: 9px 9px 0 0; background: var(--bg); color: var(--muted);
    font-size: 14px; max-width: 270px; position: relative; line-height: 1.4;
  }
  .tab.active { color: var(--fg); border-color: var(--accent); }
  .tab.hist { opacity: .72; }
  .tab .name { font-weight: 600; font-size: 14.5px; display: block; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
  .tab .sub { color: var(--muted); display: block; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 250px; font-size: 12.5px; }
  .tab .ping { display: none; position: absolute; top: 5px; inset-inline-start: 6px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--new); }
  .tab.haschange .ping { display: block; }
  /* the ONLY scrolling region */
  #wrap { flex: 1 1 auto; overflow-y: scroll; overscroll-behavior: contain; direction: ltr;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  /* always-visible scrollbar (macOS hides overlay bars until you scroll) */
  #wrap::-webkit-scrollbar { width: 11px; }
  #wrap::-webkit-scrollbar-track { background: transparent; }
  #wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 7px;
    border: 2px solid var(--bg); }
  #wrap::-webkit-scrollbar-thumb:hover { background: #45475a; }
  #content { max-width: 860px; margin: 0 auto; padding: 22px 28px 90px; direction: rtl; text-align: right; }
  #content h3 { line-height: 1.4; margin: 1.4em 0 .3em; color: var(--accent); font-size: 1em; }
  /* per-turn separation: your messages get a warm tinted box, Claude's stay as-is */
  #content .turn { border-radius: 12px; padding: 2px 18px 10px; margin: 22px 0; }
  #content .turn.user {
    color: var(--user); background: rgba(245,194,231,.07);
    border-right: 3px solid var(--user);
  }
  #content .turn.user h3 { color: var(--user); }
  #content .turn.user a { color: #f9c9ec; }
  #content .turn.assistant { padding-inline: 0; }   /* Claude: clean, no box/line — just spacing */
  /* per-reply "copy all" button, shown at the bottom of each Claude turn */
  #content .turn.assistant .copyall {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px; padding: 5px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; color: var(--accent);
    background: rgba(137,180,250,.12);
    border: 1px solid var(--accent); border-radius: 8px;
    transition: background .15s, color .15s;
  }
  #content .turn.assistant .copyall:hover { background: var(--accent); color: var(--bg); }
  /* collapsible tool actions (Edit/Write/Bash) + outputs */
  #content details.tool {
    margin: 8px 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--code-bg); direction: rtl;
  }
  #content details.tool > summary {
    cursor: pointer; padding: 6px 12px; color: var(--muted); font-size: 13px;
    list-style: none; user-select: none;
  }
  #content details.tool > summary::-webkit-details-marker { display: none; }
  #content details.tool > summary::before { content: '▸ '; color: var(--muted); }
  #content details.tool[open] > summary::before { content: '▾ '; }
  #content details.tool[open] > summary { border-bottom: 1px solid var(--border); }
  #content details.tool summary code { color: var(--accent); direction: ltr; unicode-bidi: embed; }
  #content details.tool.result > summary code,
  #content details.tool.result > summary { color: #7f849c; }
  /* "Claude finished with no text" — a calm note, not a failed-looking reply */
  #content .noreply { color: var(--muted); font-style: italic; font-size: 13px;
    opacity: .8; padding: 2px 0; }
  #content details.tool pre {
    margin: 0; border: none; border-radius: 0 0 8px 8px;
    max-height: 380px; overflow: auto; font-size: 13px;
  }
  /* plan / question blocks: accent + RTL wrapping (Hebrew prose, not code) */
  #content details.plan { border-color: var(--accent); }
  #content details.plan > summary { color: var(--accent); font-weight: 600; }
  #content details.plan pre {
    white-space: pre-wrap; word-break: break-word; direction: rtl; text-align: right;
    max-height: none; font-size: 14px; line-height: 1.6;
    font-family: -apple-system, "SF Hebrew", "Arial Hebrew", system-ui, sans-serif;
  }
  #content a { color: var(--accent); }
  #content code {
    background: var(--code-bg); padding: .15em .4em; border-radius: 5px;
    font-family: "SF Mono", Menlo, monospace; font-size: .9em;
    direction: ltr; unicode-bidi: embed; display: inline-block;
  }
  #content pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; direction: ltr; text-align: left;
  }
  #content pre code { background: none; padding: 0; }
  #content table { border-collapse: collapse; margin: 1.1em 0; width: 100%;
    table-layout: fixed; font-size: .93em; line-height: 1.55; }
  /* isolate: a latin run in one cell must not reorder its RTL neighbour.
     top + break-word: prose cells of unequal length still line up and never overflow. */
  #content th, #content td { border: 1px solid var(--border); padding: 8px 12px;
    text-align: right; unicode-bidi: isolate; vertical-align: top; overflow-wrap: anywhere; }
  #content th { background: var(--code-bg); color: var(--accent); font-weight: 700; }
  #content tbody tr:nth-child(even) { background: rgba(255,255,255,.022); }
  #content blockquote { margin: 1em 0; padding: .2em 16px; border-right: 3px solid var(--accent); color: var(--muted); }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
  #content ul, #content ol { padding-right: 1.4em; padding-left: 0; }
  #empty { color: var(--muted); text-align: center; margin-top: 60px; }

  /* ===== 📋 פנקס-תצוגה (render pad) — הדבק טקסט גולמי → תצוגה יפה RTL, ללא AI ===== */
  #padFab {
    position: fixed; right: 0; top: 44%; z-index: 45;
    background: var(--code-bg); color: var(--accent);
    border: 1px solid var(--accent); border-right: none;
    border-radius: 10px 0 0 10px; padding: 12px 9px;
    font-size: 13px; font-weight: 600; cursor: pointer; user-select: none;
    writing-mode: vertical-rl; letter-spacing: 1px;
    box-shadow: -2px 2px 10px rgba(0,0,0,.4); transition: background .15s, color .15s;
  }
  #padFab:hover { background: var(--accent); color: var(--bg); }
  #pad {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
    align-items: center; justify-content: center;
  }
  #pad.open { display: flex; }
  #padPanel {
    width: 94vw; height: 92vh; background: var(--bg);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #padBar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--code-bg); border-bottom: 1px solid var(--border);
  }
  #padBar .title { font-weight: 700; color: var(--accent); }
  #padBar .spacer { flex: 1 1 auto; }
  #padBar button {
    cursor: pointer; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 13px;
    padding: 5px 12px; transition: background .15s, border-color .15s;
  }
  #padBar button:hover { border-color: var(--accent); }
  #padBar #padClose { border-color: transparent; font-size: 18px; padding: 2px 10px; color: var(--muted); }
  #padBar #padClose:hover { color: #f38ba8; }
  #padMain { flex: 1 1 auto; display: flex; min-height: 0; }
  #padSrc {
    flex: 0 0 32%; min-width: 220px; resize: none; border: none; outline: none;
    background: var(--code-bg); color: var(--fg); font: inherit; font-size: 14px;
    line-height: 1.6; padding: 16px 18px; direction: rtl; text-align: right;
    border-left: 1px solid var(--border); overflow: auto;
  }
  #pad.hideSrc #padSrc { display: none; }
  #padView {
    flex: 1 1 auto; overflow-y: auto; padding: 26px 34px;
    direction: rtl; text-align: right; max-width: 980px; margin: 0 auto; width: 100%;
    font-size: 19px; line-height: 1.75;
  }
  #padView .ph { color: var(--muted); text-align: center; margin-top: 22vh; font-size: 15px; }
  /* mirror the chat's content styling so the render looks identical */
  #padView h1 { font-size: 1.5em; margin: .8em 0 .35em; color: var(--fg); }
  #padView h2 { font-size: 1.25em; margin: .9em 0 .3em; color: var(--fg); }
  #padView h3 { font-size: 1.08em; margin: 1em 0 .3em; color: var(--accent); }
  #padView a { color: var(--accent); }
  #padView code {
    background: var(--code-bg); padding: .15em .4em; border-radius: 5px;
    font-family: "SF Mono", Menlo, monospace; font-size: .9em;
    direction: ltr; unicode-bidi: embed; display: inline-block;
  }
  #padView pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; direction: ltr; text-align: left;
  }
  #padView pre code { background: none; padding: 0; }
  #padView table { border-collapse: collapse; margin: 1.1em 0; width: 100%;
    table-layout: fixed; font-size: .82em; line-height: 1.55; }
  #padView th, #padView td { border: 1px solid var(--border); padding: 8px 12px;
    text-align: right; unicode-bidi: isolate; vertical-align: top; overflow-wrap: anywhere; }
  #padView th { background: var(--code-bg); color: var(--accent); font-weight: 700; }
  #padView tbody tr:nth-child(even) { background: rgba(255,255,255,.022); }
  #padView blockquote { margin: 1em 0; padding: .2em 16px; border-right: 3px solid var(--accent); color: var(--muted); }
  #padView hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
  #padView ul, #padView ol { padding-right: 1.4em; padding-left: 0; }
  #padView li { margin: .25em 0; }
  footer {
    flex: 0 0 auto; background: var(--code-bg); border-top: 1px solid var(--border);
    padding: 9px 18px; font-size: 15px; color: var(--muted);
    display: flex; align-items: center; gap: 16px;
  }
  footer .max { color: var(--new); }
  footer .max.warn { color: #f9e2af; }
  footer .max.hot { color: #f38ba8; }
  #newBtn {
    cursor: pointer; user-select: none; border: 1px solid var(--accent);
    border-radius: 7px; padding: 3px 11px; color: var(--accent);
    background: var(--bg); font-size: 13px; margin-inline-start: 10px;
  }
  #compose {
    flex: 0 0 auto; background: transparent; padding: 8px 16px 16px;
  }
  #composeInner {
    max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg); border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 10px; box-shadow: 0 2px 14px rgba(0,0,0,.25);
  }
  #compose textarea {
    flex: 1 1 auto; resize: none; min-height: 54px; max-height: 220px;
    background: transparent; color: var(--fg); border: none;
    padding: 8px 8px; font: inherit; font-size: 16px; line-height: 1.5;
    direction: rtl; text-align: right; outline: none;
  }
  #compose textarea:disabled { opacity: .5; }
  #sendBtn {
    cursor: pointer; border: none; border-radius: 10px; padding: 9px 18px;
    background: var(--accent); color: #1e1e2e; font-weight: 600; font-size: 15px;
  }
  #sendBtn:disabled { opacity: .4; cursor: default; }
  /* read-only caption — clearly a label, NOT an input row */
  #composeNote { color: var(--muted); font-size: 13px; text-align: center;
    padding: 14px 16px 18px; background: transparent; font-style: italic; }
  #composeNote #adoptBtn {
    margin-inline-start: 8px; cursor: pointer; border: 1px solid var(--accent);
    color: var(--accent); background: var(--bg); border-radius: 8px;
    padding: 5px 12px; font-size: 13px; font-weight: 600; font-style: normal;
  }
  #composeNote #adoptBtn:hover { background: var(--accent); color: #1e1e2e; }
  #dirSel {
    margin-inline-start: 8px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 7px; padding: 3px 8px; font-size: 13px;
  }
  /* permission-level pickers (header = new-chat default, compose = live for current chat) */
  #permSel {
    margin-inline-start: 6px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 7px; padding: 3px 8px; font-size: 13px;
  }
  #permLive {
    align-self: center; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; font-size: 13px;
    cursor: pointer;
  }
  #permLive.full, #permSel.full { border-color: #f38ba8; color: #f38ba8; font-weight: 600; }
  #attachBtn, #kbfixInline {
    cursor: pointer; user-select: none; border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; background: var(--bg); color: var(--fg); font-size: 16px;
  }
  #kbfixInline { font-size: 14px; white-space: nowrap; }
  #kbfixInline.flash { border-color: #4ade80; color: #4ade80; }
  /* ── left rail: stacks the daily-tasks widget above the keyboard-fixer ── */
  #leftRail {
    position: fixed; left: 14px; top: var(--rail-top, 104px); z-index: 60; width: 282px;
    display: flex; flex-direction: column; gap: 12px;
    max-height: calc(100vh - var(--rail-top, 104px) - 18px); overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: none;
  }
  #leftRail::-webkit-scrollbar { display: none; }

  /* 📝 daily tasks / sticky-notes widget */
  #notes {
    flex: 0 0 auto; background: #292621; border: 2px solid #f9e2af; border-radius: 12px;
    box-shadow: 0 6px 22px rgba(0,0,0,.55); direction: rtl; overflow: hidden;
  }
  #notesHead {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    cursor: pointer; padding: 9px 12px; background: rgba(249,226,175,.12);
    color: #f9e2af; font-weight: 700; font-size: 13.5px; user-select: none;
  }
  #notesTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #notesToggle { color: #f9e2af; font-size: 11px; flex: 0 0 auto; }
  /* peek: visible only when collapsed; body: visible only when expanded */
  #notes:not(.collapsed) #notesPeek { display: none; }
  #notes.collapsed #notesBody { display: none; }
  #notesPeek { padding: 7px 11px 11px; display: flex; flex-direction: column; gap: 6px; }
  .peekItem { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--fg);
    white-space: nowrap; overflow: hidden; }
  .peekItem .ptxt { overflow: hidden; text-overflow: ellipsis; }
  .peekMore { color: var(--muted); font-size: 12px; }
  .notesEmpty { color: var(--muted); font-style: italic; font-size: 13px; padding: 2px 0; }
  #notesBody { padding: 9px 11px 13px; display: flex; flex-direction: column; gap: 11px; }
  #notesAdd { display: flex; gap: 6px; }
  #notesInput {
    flex: 1 1 auto; background: var(--code-bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px;
    font: inherit; font-size: 14px; direction: rtl; text-align: right; outline: none;
  }
  #notesInput:focus { border-color: #f9e2af; }
  #notesAddBtn {
    cursor: pointer; border: none; border-radius: 8px; padding: 0 14px;
    background: #f9e2af; color: #292621; font-weight: 700; font-size: 19px; line-height: 1;
  }
  #notesList { list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
  .taskItem { display: flex; align-items: flex-start; gap: 9px; padding: 7px 9px;
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 9px;
    transition: opacity .2s; }
  .cb { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%;
    border: 2px solid var(--muted); cursor: pointer; transition: all .15s; position: relative; }
  .cb:hover { border-color: var(--new); background: rgba(166,227,161,.22); }
  .taskItem.done { opacity: .45; }
  .taskItem.done .cb { background: var(--new); border-color: var(--new); }
  .taskItem.done .taskTxt { text-decoration: line-through; }
  .taskTxt { flex: 1 1 auto; font-size: 14px; line-height: 1.45; word-break: break-word; }
  .taskMeta { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .taskDel { flex: 0 0 auto; cursor: pointer; color: var(--muted); font-size: 13px; opacity: .55; }
  .taskDel:hover { color: #f38ba8; opacity: 1; }
  #notesDoneBar { border-top: 1px dashed var(--border); padding-top: 9px; }
  #notesDoneToggle {
    width: 100%; cursor: pointer; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px; background: var(--bg); color: var(--new); font-size: 13px;
    font-weight: 600; text-align: center;
  }
  #notesDoneToggle:hover { border-color: var(--new); }
  #notesDone { display: flex; flex-direction: column; gap: 7px; margin-top: 8px;
    max-height: 34vh; overflow-y: auto; }
  #notesDone.hidden { display: none; }
  .doneItem { background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 10px; }
  .doneItem .t { font-size: 13.5px; color: var(--muted); text-decoration: line-through; }
  .doneItem .dates { display: flex; flex-direction: column; gap: 1px;
    font-size: 11px; color: var(--muted); margin-top: 4px; }
  .doneItem .note { font-size: 12.5px; color: var(--fg); margin-top: 5px; padding: 4px 8px;
    background: rgba(249,226,175,.08); border-right: 2px solid #f9e2af; border-radius: 5px; }
  .doneItem .restore { cursor: pointer; color: var(--accent); font-size: 11.5px;
    margin-top: 5px; display: inline-block; }
  .doneItem .restore:hover { text-decoration: underline; }

  /* ⌨️ keyboard-layout fixer — now docked inside the left rail, under the tasks */
  #kbfix {
    width: 100%;
    background: #15232b; border: 2px solid var(--new); border-radius: 12px;
    box-shadow: 0 6px 22px rgba(0,0,0,.55); direction: rtl; overflow: hidden;
  }
  #kbfixHead {
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    padding: 8px 12px; background: rgba(166,227,161,.12); color: var(--new);
    font-weight: 600; font-size: 13px; user-select: none;
  }
  #kbfixHead #kbfixToggle { color: var(--new); font-size: 11px; }
  #kbfix.collapsed #kbfixBody { display: none; }
  #kbfixBody { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #kbfixIn {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 58px;
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--border);

  #kbfixOut {
    min-height: 40px; background: var(--code-bg); border: 1px solid var(--border);

    cursor: pointer; border: 1px solid var(--border); border-radius: 8px;

    font-size: 13px; font-weight: 600;
  }
  #kbfix button:hover { border-color: var(--accent); }
  #kbfixGo { background: var(--accent); color: #1e1e2e; border-color: var(--accent); flex: 1; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 820px; margin: 0 auto; padding: 0 26px; }
  #chips:not(:empty) { padding: 8px 26px 0; }
  .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 3px 10px 3px 6px; font-size: 12px; color: var(--fg); display: flex; gap: 6px; align-items: center; }
  .chip b { cursor: pointer; color: var(--muted); }
  .chip img { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .tab .close { display: none; position: absolute; top: 4px; inset-inline-end: 7px;
    cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; }
  .tab .close:hover { color: #f38ba8; }
  .tab.owned .close { display: block; }
  .tab.owned { padding-inline-end: 22px; }
  .tab.busy .name::before { content: '⏳ '; }
  #working { display: none; flex: 0 0 auto; align-items: center; gap: 9px;
    padding: 8px 16px; font-size: 14px; color: var(--accent);
    background: var(--code-bg); border-top: 1px solid var(--border); }
  #working.on { display: flex; }
  #working.done { color: var(--new); }
  #working.done .pdot { background: var(--new); animation: none; }
  /* floating "jump to latest" button — shown only when scrolled up */
  #toBottom {
    position: fixed; bottom: 100px; right: 26px;
    display: none; z-index: 40; cursor: pointer; border: 1px solid var(--border);
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg); color: var(--fg); font-size: 19px; line-height: 1;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #toBottom.show { display: flex; align-items: center; justify-content: center; }
  #toBottom:hover { border-color: var(--accent); color: var(--accent); }
  /* live-streaming reply: a blinking caret after the in-progress text */
  #streaming .caret {
    display: inline-block; width: 7px; height: 15px; vertical-align: text-bottom;
    margin-inline-start: 2px; background: var(--accent); animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* per-tab "finished" indicator (green ✓), shown until you open the tab */
  .tab .donecheck { display: none; position: absolute; top: 4px; inset-inline-start: 6px;
    color: var(--new); font-size: 12px; font-weight: 700; line-height: 1; }
  .tab.finished .donecheck { display: block; }
  .tab.finished .ping { display: none; }
  .tab.finished { border-color: var(--new); }
  .tab.finished .name { color: var(--new); }
  #working .pdot { width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.7); } }
  #stopBtn { margin-inline-start: auto; cursor: pointer; border: 1px solid #f38ba8;
    color: #f38ba8; background: transparent; border-radius: 8px; padding: 4px 12px; font-size: 13px; }
  #stopBtn:hover { background: #f38ba8; color: #1e1e2e; }
  /* crashed-reply (interrupted) block: the streamed text that never reached the transcript */
  #content .turn.interrupted {
    border: 1px dashed #f9a13f; border-radius: 12px; padding: 2px 18px 12px;
    background: rgba(249,161,63,.06);
  }
  #content .turn.interrupted .intbadge { color: #f9a13f; font-size: 12.5px; font-weight: 600; }
  #content .turn.interrupted .intactions { margin-top: 8px; }
  #content .turn.interrupted .intDismiss {
    cursor: pointer; border: 1px solid var(--border); color: var(--muted);
    background: transparent; border-radius: 8px; padding: 3px 12px; font-size: 12.5px;
  }
  #content .turn.interrupted .intDismiss:hover { border-color: #f9a13f; color: #f9a13f; }
  body.drag::after {
    content: '⬇︎ שחרר כדי לצרף לשיחה'; position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    color: var(--accent); background: rgba(30,30,46,.78);
    border: 3px dashed var(--accent); pointer-events: none;
  }

<body>

<script>
  if (window.marked) marked.setOptions({ breaks: true, gfm: true });

  // ---- box-drawing tables → real markdown tables --------------------------
  // Claude Code draws tables in the terminal with ┌─┬┐ │ ├─┼┤ └─┴┘. Pasted into
  // an RTL page those are just paragraph text: bidi reorders every cell and the
  // table shreds into an unreadable mess. Rebuild them as markdown pipe tables
  // so marked emits a real <table>, which RTL lays out correctly on its own.
  // Everything is gated on a genuine U+2500-block char, so ordinary markdown
  // tables (and their `|:---:|` alignment rows) pass through untouched.
  const BOX_ANY   = /[─-╿]/;              // any box-drawing char
  const BOX_START = /^[─-╿]/;
  const BOX_VERT  = /[│┃║]/g;        // │ ┃ ║
  // a border line is box chars + spaces only, and has at least one horizontal run
  const isRule = t => /^[─-╿\s]+$/.test(t) &&
                      /[─━┄┅┈┉═]/.test(t);
  // a content line is fenced by verticals on both ends
  const isRow  = t => /^[│┃║]/.test(t) && /[│┃║]$/.test(t);

  function boxBlockToMd(block) {
    // ├──┼──┤ separators close a logical row; the lines between them are one row
    // whose cells may be wrapped across several physical lines.
    const groups = [];
    let cur = null;
    for (const t of block) {
      if (isRow(t)) { if (!cur) groups.push(cur = []); cur.push(t); }
      else cur = null;
    }
    if (!groups.length) return '';
    const rows = groups.map(g => {
      const parts = g.map(t => t.slice(1, -1).split(BOX_VERT).map(c => c.trim()));
      const n = Math.max(...parts.map(p => p.length));
      const cells = [];
      for (let k = 0; k < n; k++)                        // stitch the wrapped lines back together
        cells.push(parts.map(p => p[k] || '').filter(Boolean).join(' ').replace(/\|/g, '\\|'));
      return cells;
    });
    const w = Math.max(...rows.map(r => r.length));
    if (w < 2) return '';                                // a single column isn't a table
    const line = r => '| ' + Array.from({ length: w }, (_, k) => r[k] || ' ').join(' | ') + ' |';
    return [line(rows[0]), '|' + ' --- |'.repeat(w), ...rows.slice(1).map(line)].join('\n');
  }

  function boxToMd(src) {
    if (!src || !BOX_ANY.test(src)) return src;          // fast path: nothing box-drawn here
    const lines = src.split('\n');
    const out = [];
    let fenced = false;
    for (let i = 0; i < lines.length;) {
      if (/^\s*(```|~~~)/.test(lines[i])) fenced = !fenced;
      if (fenced || !BOX_ANY.test(lines[i])) { out.push(lines[i]); i++; continue; }
      let j = i;
      while (j < lines.length && BOX_ANY.test(lines[j]) && !/^\s*(```|~~~)/.test(lines[j])) j++;
      const raw = lines.slice(i, j), run = raw.map(l => l.trim());
      const md = run.every(t => isRule(t) || isRow(t)) ? boxBlockToMd(run) : '';
      if (md) out.push('', md, '');
      else if (run.length >= 2 && run.every(t => BOX_START.test(t)))
        out.push('', '```text', ...raw, '```', '');      // tree/diagram: fence it so <pre dir=ltr> keeps the alignment
      else out.push(...raw);                             // a stray box char inside prose — leave it alone
      i = j;
    }
    return out.join('\n');
  }

  const elTabs = document.getElementById('tabs');
  const elContent = document.getElementById('content');
  const elWrap = document.getElementById('wrap');
  const elDot = document.getElementById('dot');
  const elStatus = document.getElementById('status');
  const elHist = document.getElementById('histBtn');
  const elFootTok = document.getElementById('foot-tok');
  const elFootMax = document.getElementById('foot-max');
  const elNew = document.getElementById('newBtn');
  const elMsg = document.getElementById('msg');
  const elSend = document.getElementById('sendBtn');
  const elNote = document.getElementById('composeNote');
  const elCompose = document.getElementById('compose');
  const elDirSel = document.getElementById('dirSel');
  const elPermSel = document.getElementById('permSel');
  const elPermLive = document.getElementById('permLive');
  const elModelSel = document.getElementById('modelSel');
  const elModelLive = document.getElementById('modelLive');
  const elAttach = document.getElementById('attachBtn');
  const elFile = document.getElementById('fileInput');
  const elChips = document.getElementById('chips');
  let pendingFiles = [];   // [{path, name}] attachments for the CURRENT tab's next message
  let filesByTab = {};     // id -> that tab's pending attachments (kept per-tab, like the text draft)
  const elWorking = document.getElementById('working');
  const elToBottom = document.getElementById('toBottom');
  const elWorkState = document.getElementById('workState');
  let statusMap = {};      // id -> {state, started, detail, tokens, partial} live indicator
  let serverDown = false;  // /status unreachable mid-run (e.g. a self-restart of this server)
  let statusFails = 0;     // consecutive /status fetch failures (debounce a single transient miss)

  // keep the floating left rail (tasks + ⌨️ fixer) sitting just UNDER the tab strip,
  // never on top of it — recompute whenever the header changes height (tabs/history toggle)
  (function syncRailTop() {
    const elHeader = document.querySelector('header');
    const setTop = () => document.documentElement.style.setProperty(
      '--rail-top', (elHeader.getBoundingClientRect().height + 10) + 'px');
    setTop();
    if (window.ResizeObserver) new ResizeObserver(setTop).observe(elHeader);
    window.addEventListener('resize', setTop);
  })();

  // let a normal (vertical) mouse-wheel scroll the tab strip sideways — many mice/trackpads
  // can't scroll a horizontal strip otherwise, so the far tabs were unreachable.
  // Use scrollBy (not scrollLeft=…), because the strip's `scroll-behavior: smooth` makes a
  // direct scrollLeft assignment animate async — readback can't tell if it moved. In this
  // RTL strip a NEGATIVE left delta walks toward the hidden/older tabs; positive returns.
  elTabs.addEventListener('wheel', (e) => {
    if (elTabs.scrollWidth - elTabs.clientWidth <= 1) return;   // nothing to scroll
    const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (!delta) return;
    elTabs.scrollBy({ left: -delta, behavior: 'instant' });
    e.preventDefault();
  }, { passive: false });

  // clickable ‹ › arrows — the always-visible way to reach far tabs (no wheel/scrollbar needed).
  // RTL strip: scrollLeft runs 0 (newest, right) → −max (oldest, left).
  const elTabStrip = document.getElementById('tabStrip');
  const elArrowL = document.getElementById('tabArrowL');
  const elArrowR = document.getElementById('tabArrowR');
  function updateTabArrows() {
    const max = elTabs.scrollWidth - elTabs.clientWidth;
    const sl = elTabs.scrollLeft;                       // 0 … −max
    elTabStrip.classList.toggle('canL', max > 1 && sl > -max + 1);   // older tabs exist to the left
    elTabStrip.classList.toggle('canR', max > 1 && sl < -1);         // newer tabs exist to the right
  }
  const tabPage = () => Math.max(120, elTabs.clientWidth * 0.7);
  elArrowL.addEventListener('click', () => elTabs.scrollBy({ left: -tabPage(), behavior: 'smooth' }));
  elArrowR.addEventListener('click', () => elTabs.scrollBy({ left:  tabPage(), behavior: 'smooth' }));
  elTabs.addEventListener('scroll', updateTabArrows, { passive: true });
  window.addEventListener('resize', updateTabArrows);

  // raw tool name (e.g. "Bash", "mcp__playwright__browser_evaluate") → readable Hebrew
  function friendlyTool(detail) {
    if (!detail) return 'כלי';
    const map = {
      Bash: 'מריץ פקודה', Read: 'קורא קובץ', Edit: 'עורך קובץ', Write: 'כותב קובץ',
      MultiEdit: 'עורך קובץ', Glob: 'מחפש קבצים', Grep: 'מחפש בקוד', LS: 'רושם תיקייה',
      WebFetch: 'טוען דף אינטרנט', WebSearch: 'מחפש באינטרנט', TodoWrite: 'מעדכן מטלות',
      Task: 'מריץ סוכן', NotebookEdit: 'עורך מחברת',
    };
    if (map[detail]) return map[detail];
    const m = detail.match(/^mcp__([a-z0-9_-]+?)__(.+)$/i);   // mcp__server__tool
    if (m) {
      const server = m[1], tool = m[2];
      if (server === 'playwright') {
        const pw = {
          browser_navigate: 'ניווט', browser_evaluate: 'מריץ קוד', browser_click: 'לחיצה',
          browser_type: 'הקלדה', browser_fill_form: 'ממלא טופס', browser_snapshot: 'קורא מבנה-דף',
          browser_take_screenshot: 'צילום-מסך', browser_wait_for: 'ממתין', browser_navigate_back: 'חזרה',
          browser_press_key: 'מקש', browser_select_option: 'בחירה', browser_file_upload: 'העלאת קובץ',
        };
        return 'דפדפן · ' + (pw[tool] || tool.replace(/^browser_/, '').replace(/_/g, ' '));
      }
      return server + ' · ' + tool.replace(/_/g, ' ');
    }
    return detail;
  }
  // live "alive" indicator bits — a braille spinner + gerunds that rotate while it thinks,
  // so the status feels like the terminal's "Spinning… · thinking more" rather than a frozen line
  const SPIN = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
  const THINK_WORDS = ['חושב', 'מהרהר', 'מתכנן', 'שוקל', 'מנתח', 'מעבד', 'רוקם רעיון', 'מצרף קצוות'];
  let spinFrame = 0;
  function elapsedSecs(st) {
    return st && st.started ? Math.max(0, Math.floor(Date.now() / 1000 - st.started)) : 0;
  }
  function fmtElapsed(secs) {
    return secs < 60 ? secs + ' שנ׳' : Math.floor(secs / 60) + ' דק׳ ' + (secs % 60) + ' שנ׳';
  }
  function workLabel(st, secs) {
    const s = st.state;
    if (s === 'tool') return '🔧 ' + friendlyTool(st.detail);
    if (s === 'responding') return '✍️ כותב';
    if (s === 'thinking') return '🤔 ' + THINK_WORDS[Math.floor((secs || 0) / 3) % THINK_WORDS.length] + '…';
    return '⏳ עובד';
  }
  // the body text of the bottom working line (spinner + label + elapsed + tokens)
  function workBodyText(st) {
    const secs = elapsedSecs(st);
    let txt = SPIN[spinFrame % SPIN.length] + ' ' + workLabel(st, secs) + ' · ' + fmtElapsed(secs);
    if (st.tokens) txt += ' · ' + fmtTok(st.tokens) + ' טוקנים';
    return txt;
  }
  function renderWorking() {
    const st = statusMap[selectedId];
    if (serverDown && st) {   // can't reach the server mid-run — show it, don't spin forever
      elWorking.className = 'on';
      elWorking.innerHTML = '<span class="pdot"></span><bdi dir="rtl">🔄 השרת מאותחל… ' +
        'התשובה ממשיכה ברקע ותופיע כשהשרת יחזור</bdi>';
      return;
    }
    if (!st) {   // not running — but flash "✓ הסתיים" briefly if this chat just finished
      if (doneFlash[selectedId] && Date.now() < doneFlash[selectedId]) {
        elWorking.className = 'on done';
        elWorking.innerHTML = '<span class="pdot"></span><bdi dir="rtl">✓ הסתיים</bdi>';
      } else { elWorking.className = ''; elWorking.innerHTML = ''; }
      return;
    }
    elWorking.className = 'on';
    // bdi + dir=rtl isolates any residual latin (unknown tool names) so the line never scrambles
    elWorking.innerHTML = '<span class="pdot"></span><bdi class="wbody" dir="rtl">' + esc(workBodyText(st)) + '</bdi>' +
      '<button id="stopBtn" title="עצור (כמו ESC) — אפשר אז לתקן/להוסיף">⏹ עצור</button>';
    const sb = document.getElementById('stopBtn');
    if (sb) sb.onclick = async () => {
      sb.disabled = true; sb.textContent = 'עוצר…';
      try {
        await fetch('/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: selectedId }) });
      } catch (e) { /* ignore */ }
    };
  }
  // fast, cheap animation: advance the spinner + refresh elapsed time between the slower
  // polls, updating ONLY the text nodes (never rebuilding the stop button mid-click)
  function animateWork() {
    const st = statusMap[selectedId];
    if (!st) return;
    spinFrame++;
    const wb = elWorking.querySelector('.wbody');
    if (wb) wb.textContent = workBodyText(st);
    if (elWorkState.classList.contains('work')) {
      elWorkState.textContent = SPIN[spinFrame % SPIN.length] + ' עובד… ' + fmtElapsed(elapsedSecs(st));
    }
  }

  // populate the folder picker once

  async function uploadFile(file) {
    const data = await new Promise(res => {
      const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file);
    });

  elFile.onchange = () => { for (const f of elFile.files) uploadFile(f); elFile.value = ''; };

  function fmtTok(n) {

  function relTime(iso) {

    if (m < 60) return 'בעוד ' + m + ' דק׳';

  }
  async function updateMax() {
    try {
      const res = await fetch('usage.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw 0;
      const u = await res.json();
      if (!u || u.percent_session == null || (Date.now() - u.fetched_at * 1000) > 10 * 60 * 1000) throw 0;
      const p = u.percent_session;
      const cls = p >= 85 ? 'hot' : p >= 60 ? 'warn' : '';
      let t = 'Max: ' + p + '%';
      if (u.reset_session) t += ' · ' + relTime(u.reset_session);
      if (u.percent_week != null) t += '  ·  שבועי: ' + u.percent_week + '%';
      elFootMax.className = 'max ' + cls;
      elFootMax.textContent = t + '  ·  ';

      elFootMax.textContent = '';   // soft fallback — token counter stays
    }
  }

  // Prefer an explicit ?id= from the URL (e.g. a chat opened by another local app
  // like SubsTranslator) so it lands on that exact owned session — not the last one.
  const _urlId = new URLSearchParams(location.search).get('id');
  let selectedId = _urlId || localStorage.getItem('rtl-selected') || null;
  if (_urlId) localStorage.setItem('rtl-selected', _urlId);
  let showHistory = localStorage.getItem('rtl-hist') === '1';
  let seenMtime = {};
  let tabOrder = [];               // stable tab order (ids) — so a message never reshuffles tabs
  try { tabOrder = JSON.parse(localStorage.getItem('rtl-taborder') || '[]') || []; } catch (e) {}
  let prevStatusIds = new Set();   // ids that were running last tick (to detect a finish)
  let doneFlash = {};              // id -> ms-expiry for the "✓ הסתיים" flash
  let scrollPos = {};              // id -> last scrollTop, so switching tabs restores your place
  let doneTabs = {};               // id -> true: a run finished on this tab, not yet viewed (green ✓)
  let lastMd = null;          // currently rendered markdown (change detection)
  let lastSelected = null;
  let pendingId = _urlId || null;       // a just-created chat that may not be in sessions.json yet
                                        // (URL-opened chat counts as pending so compose shows at once)

  // vertical mouse-wheel scrolls the tab strip sideways (trackpad h-scroll still native)
  elTabs.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      elTabs.scrollLeft += e.deltaY;
      e.preventDefault();

  // remember each chat's scroll position → restored on tab switch (per-tab, never shared)
  function updateToBottom() {
    const atBottom = (elWrap.scrollTop + elWrap.clientHeight) >= (elWrap.scrollHeight - 90);
    elToBottom.classList.toggle('show', !atBottom && !!selectedId);

  elHist.onclick = () => {

  };

  // ---- adopt: take ownership of a terminal-started (read-only) session ----
  async function adoptSession(id, force) {
    try {
      const res = await fetch('/adopt', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, force: !!force })
      });
      if (res.status === 409) {   // a live terminal is open in this project
        if (confirm('⚠️ נראה שטרמינל חי פתוח בפרויקט הזה.\nכתיבה מהדפדפן במקביל לטרמינל עלולה לשבש את הסשן.\nלאמץ בכל זאת?'))
          return adoptSession(id, true);
        return;
      }
      const j = await res.json();
      if (j.status === 'adopted' || j.status === 'already-owned') {
        selectedId = id; pendingId = id;

  elNote.addEventListener('click', (e) => {

      });

  // ---- compose draft persistence (survives a page refresh, per chat) ----
  const draftKey = (id) => 'rtl-draft-' + id;
  function saveDraft() {
    if (!selectedId) return;
    if (elMsg.value) localStorage.setItem(draftKey(selectedId), elMsg.value);
    else localStorage.removeItem(draftKey(selectedId));
  }
  let lastDraftChat = null;
  function loadDraft(id) {
    if (id === lastDraftChat) return;       // only when the chat actually changes — never clobber typing
    if (lastDraftChat) filesByTab[lastDraftChat] = pendingFiles;   // stash the outgoing tab's attachments
    lastDraftChat = id;
    elMsg.value = localStorage.getItem(draftKey(id)) || '';
    elMsg.style.height = 'auto';
    elMsg.style.height = Math.min(elMsg.scrollHeight, 220) + 'px';
    pendingFiles = filesByTab[id] || [];    // restore THIS tab's attachments (none → empty)

  // ---- optimistic echo: show the just-sent message instantly (poll catches up in ~1s) ----
  function removeOptimistic() { const o = document.getElementById('optimistic'); if (o) o.remove(); }
  function appendOptimistic(text, files) {
    let body = text || '';
    if (files && files.length) body += (body ? '\n' : '') + '📎 ' + files.length + ' קבצים';
    if (!body) return;
    removeOptimistic();
    const empty = elContent.querySelector('#empty'); if (empty) empty.remove();
    const box = document.createElement('div');
    box.className = 'turn user'; box.id = 'optimistic';
    const h = document.createElement('h3'); h.textContent = 'אתה 🧑';
    const p = document.createElement('div'); p.style.whiteSpace = 'pre-wrap'; p.textContent = body;
    box.appendChild(h); box.appendChild(p);
    elContent.appendChild(box);
    elWrap.scrollTop = elWrap.scrollHeight;
  }

  async function sendMsg() {
    const text = elMsg.value.trim();
    const files = pendingFiles.map(f => f.path);
    if ((!text && !files.length) || !selectedId) return;
    elMsg.value = ''; elMsg.style.height = 'auto';
    localStorage.removeItem(draftKey(selectedId));   // sent → drop the saved draft
    appendOptimistic(text, files);                   // show it immediately
    pendingFiles = []; if (selectedId) filesByTab[selectedId] = []; renderChips();
    elSend.disabled = true; elSend.textContent = 'שולח…';
    try {
      await fetch('/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: selectedId, text, files })
      });
    } catch (e) { removeOptimistic(); elMsg.value = text; }   // restore on failure
    setTimeout(() => { elSend.textContent = 'שלח'; updateSendState(); }, 600);
  }
  elSend.onclick = sendMsg;
  elMsg.addEventListener('keydown', (e) => {

  // ⌨️ תיקון פריסת-מקלדת — המרה דטרמיניסטית 1:1 לפי המקש הפיזי במקלדת העברית הסטנדרטית (אופליין, בלי API)
  const KB_EN2HE = {
    q:'/', w:"'", e:'ק', r:'ר', t:'א', y:'ט', u:'ו', i:'ן', o:'ם', p:'פ',
    a:'ש', s:'ד', d:'ג', f:'כ', g:'ע', h:'י', j:'ח', k:'ל', l:'ך',
    z:'ז', x:'ס', c:'ב', v:'ה', b:'נ', n:'מ', m:'צ',
    ';':'ף', "'":',', ',':'ת', '.':'ץ', '/':'.'
  };
  function convertKbLayout(s) {
    return s.replace(/[A-Za-z;',.\/]/g, ch => KB_EN2HE[ch.toLowerCase()] || ch);
  }

  // standalone widget (bottom-left) — always visible regardless of the open chat
  (function () {
    const wrap = document.getElementById('kbfix');
    const head = document.getElementById('kbfixHead');
    const tgl  = document.getElementById('kbfixToggle');
    const inEl = document.getElementById('kbfixIn');
    const outEl = document.getElementById('kbfixOut');
    const goEl = document.getElementById('kbfixGo');
    const cpEl = document.getElementById('kbfixCopy');
    const clrEl = document.getElementById('kbfixClear');
    function render() {
      const v = inEl.value;
      if (!v.trim()) { outEl.textContent = 'הפלט בעברית יופיע כאן'; outEl.classList.add('empty'); return; }
      outEl.textContent = convertKbLayout(v); outEl.classList.remove('empty');
    }
    inEl.addEventListener('input', render);
    goEl.addEventListener('click', () => { render(); inEl.focus(); });
    clrEl.addEventListener('click', () => { inEl.value = ''; render(); inEl.focus(); });
    cpEl.addEventListener('click', async () => {
      if (outEl.classList.contains('empty')) return;
      try { await navigator.clipboard.writeText(outEl.textContent); cpEl.textContent = '✓ הועתק'; }
      catch (e) { cpEl.textContent = '✗ שגיאה'; }
      setTimeout(() => { cpEl.textContent = '📋 העתק'; }, 1200);
    });
    head.addEventListener('click', () => {
      wrap.classList.toggle('collapsed');
      tgl.textContent = wrap.classList.contains('collapsed') ? '▲' : '▼';
    });
  })();

  // ⌨️→ in-place fix: convert the compose box itself (selection if any, else whole text)
  (function () {
    const btn = document.getElementById('kbfixInline');
    if (!btn) return;
    btn.addEventListener('click', () => {
      const v = elMsg.value;
      let s = elMsg.selectionStart, e = elMsg.selectionEnd;
      if (s == null || e == null || s === e) { s = 0; e = v.length; }   // no selection → whole box
      const fixed = convertKbLayout(v.slice(s, e));
      elMsg.value = v.slice(0, s) + fixed + v.slice(e);
      elMsg.setSelectionRange(s, s + fixed.length);                     // re-select the converted span
      elMsg.dispatchEvent(new Event('input', { bubbles: true }));       // auto-grow + persist draft
      elMsg.focus();
      btn.classList.add('flash');
      setTimeout(() => btn.classList.remove('flash'), 700);
    });
  })();
  elMsg.addEventListener('input', () => {   // auto-grow + persist draft
    elMsg.style.height = 'auto';
    elMsg.style.height = Math.min(elMsg.scrollHeight, 220) + 'px';
    saveDraft();
    updateSendState();
  });
  // auto-focus the box: on load, and "just start typing anywhere" jumps to it
  function focusCompose() {
    if (elCompose.style.display !== 'none') { try { elMsg.focus(); } catch (e) {} }
  }
  document.addEventListener('keydown', (e) => {
    if (elCompose.style.display === 'none') return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;       // already typing somewhere
    if (e.metaKey || e.ctrlKey || e.altKey) return;          // let shortcuts through
    if (e.key && e.key.length === 1) elMsg.focus();          // a printable char → focus box
  });
  // paste images/files straight into the chat
  elMsg.addEventListener('paste', (e) => {
    const items = (e.clipboardData && e.clipboardData.files) || [];
    if (items.length) { e.preventDefault(); for (const f of items) uploadFile(f); }
  });

  // enable compose only for browser-owned chats; read-only note otherwise
  let lastComposeOwned = false;
  function setCompose(sel) {
    const owned = !!(sel && sel.owned);
    elCompose.style.display = owned ? 'block' : 'none';
    if (owned) {   // reflect this chat's stored permission level into the live picker
      const p = ((window._owned || {})[sel.id] || {}).perm || 'read';
      if (elPermLive.value !== p) elPermLive.value = p;
      tintPerm(elPermLive);
      const m = ((window._owned || {})[sel.id] || {}).model || 'opus';
      if (elModelLive.value !== m) elModelLive.value = m;
      loadDraft(sel.id);   // restore this chat's saved draft (only when the chat changes)
    }
    updateSendState();
    if (owned && !lastComposeOwned) setTimeout(focusCompose, 0);   // focus when box appears
    lastComposeOwned = owned;
    if (owned) { elNote.style.display = 'none'; return; }
    elNote.style.display = sel ? 'block' : 'none';
    if (sel) {   // read-only terminal session → offer to adopt it (rebuild only on change)
      const cur = elNote.querySelector('#adoptBtn');
      if (!cur || cur.dataset.id !== sel.id) {
        elNote.innerHTML = '👁️ שיחה זו נפתחה בטרמינל — צפייה בלבד. ' +
          '<button id="adoptBtn" data-id="' + esc(sel.id) + '" ' +
          'title="הפוך לשיחה מנוהלת — לכתיבה ולסגירה">✋ אמץ שיחה זו</button>';
      }
    }
  }

  // group flat rendered output into per-turn boxes (h3 header starts a turn)
  // ---- incremental turn rendering (C+D) ----------------------------------
  // Re-parsing the whole md (up to several MB) and rebuilding all DOM on every 1s tick
  // froze the page and wiped live overlays (#optimistic → the send flicker). Instead we
  // split the md into per-turn segments — each begins with a <h3 data-role> marker (from
  // the role-tagged headers) — and only (re)build the turns that changed. In a growing
  // session that's just the last turn plus any new ones; stable history is never touched,
  // so its scroll position, open tool-blocks and DOM identity all survive untouched.
  let renderedSegs = [];      // raw segment strings currently in the DOM
  let renderedFor = null;     // session id those segments belong to

  function splitSegments(md) {
    // each piece starts at a role header; anything before the first is a preamble piece
    return md.split(/(?=<h3 data-role=)/).filter(s => s.length);
  }

  function buildTurnBox(seg) {
    const tmp = document.createElement('div');
    tmp.innerHTML = marked.parse(boxToMd(seg));
    const head = Array.from(tmp.children).find(el => el.tagName === 'H3' && el.dataset.role);
    const box = document.createElement('div');
    box.className = 'turn seg ' + (head && head.dataset.role === 'user' ? 'user' : 'assistant');
    // drop top-level <hr> (an <hr> must not orphan following text out of the box)
    Array.from(tmp.children).forEach(el => { if (el.tagName !== 'HR') box.appendChild(el); });
    if (box.classList.contains('assistant')) addCopyAll(box);
    return box;
  }

  function renderTurns(md, sameSession, sel) {
    if (!window.marked) {   // no markdown lib → dumb but safe fallback (whole thing escaped)
      elContent.innerHTML = '<pre>' + md.replace(/</g, '&lt;') + '</pre>';
      renderedSegs = []; renderedFor = null;
      return;
    }
    const segs = splitSegments(md);
    if (!sameSession || renderedFor !== sel.id) {           // fresh session → full build (rare)
      const frag = document.createDocumentFragment();
      segs.forEach(s => frag.appendChild(buildTurnBox(s)));
      elContent.innerHTML = '';
      elContent.appendChild(frag);
      renderedSegs = segs.slice(); renderedFor = sel.id;
      return;
    }
    // same session: keep the unchanged leading segments, rebuild only from the first diff
    let p = 0;
    while (p < segs.length && p < renderedSegs.length && segs[p] === renderedSegs[p]) p++;
    if (segs.length > renderedSegs.length) removeOptimistic();   // a real turn landed → drop the local echo
    const boxes = Array.from(elContent.querySelectorAll(':scope > .turn.seg'));
    for (let i = boxes.length - 1; i >= p; i--) boxes[i].remove();
    const frag = document.createDocumentFragment();
    for (let i = p; i < segs.length; i++) frag.appendChild(buildTurnBox(segs[i]));
    // keep the live overlays (#optimistic/#streaming/#interrupted) at the very end
    const overlay = elContent.querySelector('#optimistic, #streaming, #interrupted');
    if (overlay) elContent.insertBefore(frag, overlay); else elContent.appendChild(frag);
    renderedSegs = segs.slice();
  }

  // append a "copy all" button that copies the full text of Claude's reply
  function addCopyAll(box) {
    if (box.querySelector(':scope > .copyall')) return;   // already added
    const btn = document.createElement('button');
    btn.className = 'copyall';
    btn.type = 'button';
    btn.innerHTML = '📋 העתק הכל';
    btn.onclick = () => {
      // grab reply text without the "🤖 Claude" header or the button itself
      const clone = box.cloneNode(true);
      clone.querySelectorAll('h3, .copyall').forEach(n => n.remove());
      clone.querySelectorAll('details').forEach(d => d.open = true);   // include collapsed tool blocks
      const text = clone.innerText.replace(/\n{3,}/g, '\n\n').trim();
      navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = '✓ הועתק';
        setTimeout(() => { btn.innerHTML = '📋 העתק הכל'; }, 1200);
      }).catch(() => { btn.innerHTML = '✕ נכשל'; setTimeout(() => { btn.innerHTML = '📋 העתק הכל'; }, 1200); });
    };
    box.appendChild(btn);
  }

  function fmtTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  }
  function esc(s) {
    return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  // tab label: your custom name (saved) > first message of the session > project
  function tabName(s) {
    return localStorage.getItem('rtl-name-' + s.id) || s.title || s.project;
  }

  function makeTab(s, isHist) {
    const tab = document.createElement('div');
    tab.className = 'tab' + (s.id === selectedId ? ' active' : '') + (isHist ? ' hist' : '') +
      (s.owned ? ' owned' : '') + (statusMap[s.id] ? ' busy' : '') +
      (doneTabs[s.id] && s.id !== selectedId ? ' finished' : '');
    tab.dataset.id = s.id;
    const changed = seenMtime[s.id] !== undefined && s.mtime > seenMtime[s.id];
    if (changed && s.id !== selectedId) tab.classList.add('haschange');
    tab.innerHTML = '<span class="ping"></span><span class="donecheck">✓</span>' +
      (s.owned ? '<span class="close" title="סגור שיחה (תעבור להיסטוריה)">✕</span>' : '') +
      '<span class="name">' + esc(tabName(s)) + '</span>' +
      '<span class="sub">' + esc(s.project) + ' · ' + fmtTime(s.mtime) + '</span>';
    tab.title = 'דאבל-קליק לשינוי שם · ' + esc(s.short);
    const closeEl = tab.querySelector('.close');
    if (closeEl) closeEl.onclick = (e) => {
      e.stopPropagation();
      if (s.id === selectedId) { selectedId = null; pendingId = null; lastMd = null; lastSelected = null; }
      localStorage.removeItem('rtl-name-' + s.id);
      fetch('/close', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: s.id }) }).then(() => tick());
    };
    tab.onclick = () => {
      selectedId = s.id;
      delete doneTabs[s.id];                // opening the tab clears its "finished" ✓
      localStorage.setItem('rtl-selected', selectedId);
      seenMtime[s.id] = s.mtime;
      lastMd = null; lastSelected = null;   // force re-render of new tab
    };
    tab.ondblclick = (e) => {
      e.preventDefault();
      const cur = localStorage.getItem('rtl-name-' + s.id) || '';
      const v = prompt('שם לטאב (ריק = ברירת מחדל):', cur);
      if (v === null) return;
      if (v.trim()) localStorage.setItem('rtl-name-' + s.id, v.trim());
      else localStorage.removeItem('rtl-name-' + s.id);
      renderTabs(window._active || [], window._history || []);
    };
    return tab;
  }

  function renderTabs(active, history) {
    elTabs.innerHTML = '';
    active.forEach(s => elTabs.appendChild(makeTab(s, false)));
    if (showHistory) history.forEach(s => elTabs.appendChild(makeTab(s, true)));
    requestAnimationFrame(updateTabArrows);   // refresh ‹ › arrow visibility for the new tab set
  }

  async function fetchContent(sel) {
    if (!sel.md) {   // brand-new owned chat, no transcript yet
      if (lastSelected !== sel.id || lastMd !== '__empty__') {
        lastMd = '__empty__'; lastSelected = sel.id;
        elContent.innerHTML = '<p id="empty">שיחה חדשה — כתוב הודעה למטה כדי להתחיל ✍️</p>';
      }
      return;
    }
    try {
      const res = await fetch(sel.md + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      if (md === lastMd && sel.id === lastSelected) return;
      const sameSession = (sel.id === lastSelected);
      const prevTop = elWrap.scrollTop;
      const atBottom = (elWrap.scrollTop + elWrap.clientHeight) >= (elWrap.scrollHeight - 90);
      lastMd = md; lastSelected = sel.id;
      // incremental: only the changed/new turns are rebuilt, so open tool-blocks in the
      // stable history keep their state automatically (no save/restore-by-index needed).
      renderTurns(md, sameSession, sel);
      if (sameSession) {
        elWrap.scrollTop = atBottom ? elWrap.scrollHeight : prevTop;   // follow the bottom, else stay where you were
      } else {
        // switched tab → restore ITS place; re-apply next frame so a not-yet-laid-out
        // (or just-grown) render can't clamp us too high up the conversation
        const saved = scrollPos[sel.id];
        const applyScroll = () => { elWrap.scrollTop = (saved == null) ? elWrap.scrollHeight : saved; };
        applyScroll();
        requestAnimationFrame(applyScroll);
      }
    } catch (e) { /* keep last content on a transient miss */ }
  }

  // ---- stable tab order: pin each tab's slot so sending a message never reshuffles ----
  function applyStableOrder(active, history) {
    const all = [...active, ...history];
    const present = new Set(all.map(s => s.id));
    let changed = false;
    if (!tabOrder.length) {
      tabOrder = all.map(s => s.id); changed = true;          // seed once with the current order
    } else {
      all.forEach(s => { if (!tabOrder.includes(s.id)) { tabOrder.unshift(s.id); changed = true; } });  // new chat → rightmost, then fixed
    }
    const pruned = tabOrder.filter(id => present.has(id) || id === selectedId || id === pendingId);
    if (pruned.length !== tabOrder.length) { tabOrder = pruned; changed = true; }
    if (changed) localStorage.setItem('rtl-taborder', JSON.stringify(tabOrder));
    const rank = (id) => { const i = tabOrder.indexOf(id); return i < 0 ? 1e9 : i; };
    return {
      active: active.slice().sort((a, b) => rank(a.id) - rank(b.id)),
      history: history.slice().sort((a, b) => rank(a.id) - rank(b.id)),
    };
  }

  // ---- browser tab title + favicon: shows working / ready even from another browser tab ----
  function setFavicon(state) {
    const color = state === 'idle' ? '#89b4fa' : '#a6e3a1';   // blue idle, green working/ready
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
      '<rect width="32" height="32" rx="7" fill="#1e1e2e"/>' +
      '<circle cx="16" cy="16" r="9" fill="' + color + '"/></svg>';
    let link = document.getElementById('favicon');
    if (!link) { link = document.createElement('link'); link.id = 'favicon'; link.rel = 'icon'; document.head.appendChild(link); }
    link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
  }
  function anyDoneFlash() { const now = Date.now(); return Object.values(doneFlash).some(t => now < t); }
  function updateDocTitle() {
    const base = 'Claude · RTL Chat';
    if (Object.keys(statusMap).length) { document.title = '● עובד… · ' + base; setFavicon('work'); }
    else if (anyDoneFlash()) { document.title = '✓ מוכן · ' + base; setFavicon('done'); }
    else { document.title = base; setFavicon('idle'); }
  }

  // big header pill for the CURRENT chat — 🟡 working (with elapsed) / 🟢 ready
  function updateWorkState() {
    const st = statusMap[selectedId];
    if (st) {
      elWorkState.className = 'work';
      elWorkState.textContent = SPIN[spinFrame % SPIN.length] + ' עובד… ' + fmtElapsed(elapsedSecs(st));
    } else if (doneFlash[selectedId] && Date.now() < doneFlash[selectedId]) {
      elWorkState.className = 'ready'; elWorkState.textContent = '✓ הסתיים';
    } else {
      elWorkState.className = 'ready'; elWorkState.textContent = '🟢 מוכן';
    }
  }

  // live-streaming assistant reply: show the in-progress text (from /status) as it arrives
  function renderStreaming() {
    const st = statusMap[selectedId];
    const partial = (st && st.state === 'responding' && st.partial) ? st.partial : '';
    let bubble = document.getElementById('streaming');
    if (!partial) { if (bubble) bubble.remove(); return; }
    const atBottom = (elWrap.scrollTop + elWrap.clientHeight) >= (elWrap.scrollHeight - 90);
    if (!bubble || bubble.parentNode !== elContent) {
      bubble = document.createElement('div');
      bubble.id = 'streaming'; bubble.className = 'turn assistant';
      elContent.appendChild(bubble);
    }
    const empty = elContent.querySelector('#empty'); if (empty) empty.remove();
    // escape `<` so a literal tag Claude types mid-stream (e.g. `<code dir="ltr">`
    // while discussing RTL) can't open a real element and swallow the rest of the
    // bubble — same disarm extract.py applies to the stored transcript (md_text).
    bubble.innerHTML = '<h3>🤖 Claude</h3>' +
      (window.marked ? marked.parse(boxToMd(partial.replace(/</g, '&lt;'))) : '<div style="white-space:pre-wrap">' + esc(partial) + '</div>') +
      '<span class="caret"></span>';
    if (atBottom) elWrap.scrollTop = elWrap.scrollHeight;
  }

  // safety net: a reply that was streamed live but never saved to the transcript
  // (turn crashed mid-write — API drop / kill). The server persists it to
  // s-<id>.interrupted; show it here so the text isn't silently lost.
  let interruptedBusy = false;
  async function renderInterrupted(sel) {
    if (!sel) return;
    const existing = () => document.getElementById('interrupted');
    if (statusMap[sel.id]) { const b = existing(); if (b) b.remove(); return; }  // a new run supersedes it
    if (interruptedBusy) return;
    interruptedBusy = true;
    let txt = '';
    try {
      // via /interrupted (always 200, empty when absent) — not the static file, whose
      // 404 on every idle tick spammed the console.
      const r = await fetch('/interrupted?id=' + sel.id + '&t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) txt = (await r.text() || '').trim();
    } catch (e) { interruptedBusy = false; return; }
    interruptedBusy = false;
    if (sel.id !== selectedId) return;             // tab switched mid-fetch
    let b = existing();
    if (!txt) { if (b) b.remove(); return; }
    if (!b || b.parentNode !== elContent) {
      b = document.createElement('div'); b.id = 'interrupted'; b.className = 'turn assistant interrupted';
      elContent.appendChild(b);
    }
    b.innerHTML = '<h3>🤖 Claude · <span class="intbadge">⚠️ התשובה נקטעה — לא נשמרה בתמלול</span></h3>' +
      (window.marked ? marked.parse(boxToMd(txt.replace(/</g, '&lt;'))) : '<div style="white-space:pre-wrap">' + esc(txt) + '</div>') +
      '<div class="intactions"><button class="intDismiss">סגור הודעה זו</button></div>';
    b.querySelector('.intDismiss').onclick = async () => {
      b.remove();
      try {
        await fetch('/dismiss-interrupted', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: sel.id }) });
      } catch (e) { /* it'll also clear on the next message */ }
    };
  }

  // reflect running (⏳) / finished (✓) on existing tabs without a full strip rebuild
  function paintTabStates() {
    document.querySelectorAll('#tabs .tab').forEach(tab => {
      const id = tab.dataset.id;
      tab.classList.toggle('busy', !!statusMap[id]);
      tab.classList.toggle('finished', !!doneTabs[id] && id !== selectedId);
    });
  }

  // fast, lightweight status poll: live indicator + streaming text + finished marks
  async function pollStatus() {
    let m;
    try { m = await (await fetch('/status?t=' + Date.now(), { cache: 'no-store' })).json() || {}; }
    catch (e) {                                    // /status unreachable
      statusFails++;
      // mid-run + can't reach the server (commonly: the chat just restarted its OWN server)
      // → don't leave a frozen spinner. The turn now runs detached and keeps writing the
      // transcript; surface that instead of pretending it's still streaming.
      if (statusFails >= 2 && Object.keys(statusMap).length) { serverDown = true; renderWorking(); }
      return;                                       // otherwise keep last state
    }
    statusFails = 0; serverDown = false;
    const nowIds = new Set(Object.keys(m));
    prevStatusIds.forEach(id => {                   // was running, now gone → just finished
      if (!nowIds.has(id)) { doneFlash[id] = Date.now() + 4000; if (id !== selectedId) doneTabs[id] = true; }
    });
    prevStatusIds = nowIds;
    statusMap = m;
    if (selectedId) delete doneTabs[selectedId];    // you're viewing it → no ✓ needed
    renderWorking(); renderStreaming(); updateDocTitle(); updateWorkState(); paintTabStates(); updateToBottom();
  }

  async function tick() {
    try {
      try { window._owned = await (await fetch('owned.json?t=' + Date.now(), { cache: 'no-store' })).json() || {}; }
      catch (e) { window._owned = window._owned || {}; }
      const res = await fetch('sessions.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const sessions = data.sessions || [];
      let active = sessions.filter(s => s.active);
      let history = sessions.filter(s => !s.active);
      ({ active, history } = applyStableOrder(active, history));   // keep tabs in a fixed order
      window._active = active; window._history = history;   // for instant re-render on rename
      elDot.classList.add('live');
      elStatus.textContent = 'חי · ' + active.length + ' פעיל' + (active.length === 1 ? '' : 'ים') +
        ' · מתעדכן אוטומטית';
      elHist.style.display = history.length ? 'inline-block' : 'none';
      elHist.className = showHistory ? 'on' : '';
      elHist.textContent = (showHistory ? '▾ ' : '▸ ') + 'היסטוריה (' + history.length + ')';

      sessions.forEach(s => { if (seenMtime[s.id] === undefined) seenMtime[s.id] = s.mtime; });
      const pool = showHistory ? sessions : (active.length ? active : sessions);
      // don't reset away from a chat we just created (it may not be in the index yet)
      if (!selectedId || (!pool.some(s => s.id === selectedId) && selectedId !== pendingId)) {
        selectedId = pool.length ? pool[0].id : null;
      }
      if (pendingId && sessions.some(s => s.id === pendingId)) pendingId = null;  // it landed
      renderTabs(active, history);

      let sel = sessions.find(s => s.id === selectedId);
      // synthesize a placeholder if the just-created chat hasn't been indexed yet
      if (!sel && selectedId && selectedId === pendingId) {
        sel = { id: selectedId, owned: true, md: null, tokens: 0, out: 0, mtime: 0 };
      }
      setCompose(sel);
      renderWorking();
      updateDocTitle();
      updateWorkState();
      if (sel) {
        seenMtime[sel.id] = sel.mtime;
        elFootTok.textContent = '🔤 ' + fmtTok(sel.tokens) + ' טוקנים · ' + fmtTok(sel.out) + ' out';
        await fetchContent(sel);
        renderStreaming();
        renderInterrupted(sel);
        updateToBottom();
      } else { elContent.innerHTML = '<p id="empty">אין סשן נבחר…</p>'; }
      updateMax();
    } catch (e) {
      elDot.classList.remove('live');
      elStatus.textContent = 'אין חיבור לשרת (' + e.message + ')';
    }
  }
  // ── 📝 daily tasks / sticky-notes widget (left rail) ──────────────────────
  // Persists in localStorage; the open list carries over day-to-day (only the
  // title changes with the weekday). Completing a task moves it — with its
  // open/close dates and an optional closing note — to the "done" archive.
  (function () {
    const KEY = 'rtl-tasks-v1';
    const WD = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    const $ = (id) => document.getElementById(id);
    const elNotes = $('notes'), elHead = $('notesHead'), elTitle = $('notesTitle'),
      elTgl = $('notesToggle'), elPeek = $('notesPeek'), elInput = $('notesInput'),
      elAdd = $('notesAddBtn'), elList = $('notesList'),
      elDoneTgl = $('notesDoneToggle'), elDone = $('notesDone');

    function esc(s) {
      return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(KEY));
        if (d && Array.isArray(d.active) && Array.isArray(d.done)) return d;
      } catch (e) { /* ignore */ }
      return { active: [], done: [] };
    }
    let state = load();
    const save = () => localStorage.setItem(KEY, JSON.stringify(state));
    const uid = () => 't' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
    function fmtDate(ts) {
      const d = new Date(ts);
      return 'יום ' + WD[d.getDay()] + ' · ' +
        d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' +
        d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    }
    const setTitle = () => { elTitle.textContent = '📝 משימות ליום ' + WD[new Date().getDay()] + ' אלחנן'; };

    function render() {
      setTitle();
      // peek (collapsed) — up to 3 open tasks
      if (!state.active.length) {
        elPeek.innerHTML = '<div class="notesEmpty">אין משימות פתוחות 🎉</div>';
      } else {
        const top = state.active.slice(0, 3).map(t =>
          '<div class="peekItem"><span class="cb" data-done="' + t.id + '" title="סמן כבוצע"></span>' +
          '<span class="ptxt">' + esc(t.text) + '</span></div>').join('');
        const extra = state.active.length - 3;
        elPeek.innerHTML = top + (extra > 0 ? '<div class="peekMore">+ עוד ' + extra + ' משימות…</div>' : '');
      }
      // full open list (expanded)
      if (!state.active.length) {
        elList.innerHTML = '<li class="notesEmpty">אין משימות פתוחות 🎉</li>';
      } else {
        const todayK = dayKey(Date.now());
        elList.innerHTML = state.active.map(t => {
          const carried = dayKey(t.createdAt) !== todayK
            ? '<span class="taskMeta">↪ מאז יום ' + WD[new Date(t.createdAt).getDay()] + '</span>' : '';
          return '<li class="taskItem" data-id="' + t.id + '">' +
            '<span class="cb" data-done="' + t.id + '" title="סמן כבוצע"></span>' +
            '<span class="taskTxt">' + esc(t.text) + carried + '</span>' +
            '<span class="taskDel" data-del="' + t.id + '" title="מחק">🗑</span></li>';
        }).join('');
      }
      // done archive
      const hidden = elDone.classList.contains('hidden');
      elDoneTgl.textContent = (hidden ? '▸ ' : '▾ ') + 'משימות שהושלמו (' + state.done.length + ')';
      elDone.innerHTML = state.done.length
        ? state.done.slice().reverse().map(t =>
            '<div class="doneItem">' +
              '<div class="t">' + esc(t.text) + '</div>' +
              '<div class="dates"><span>🟢 נפתחה: ' + fmtDate(t.createdAt) + '</span>' +
                '<span>✓ נסגרה: ' + fmtDate(t.doneAt) + '</span></div>' +
              (t.note ? '<div class="note">📝 ' + esc(t.note) + '</div>' : '') +
              '<span class="restore" data-restore="' + t.id + '">↩ החזר לפתוחות</span>' +
            '</div>').join('')
        : '<div class="notesEmpty">עדיין לא הושלמו משימות</div>';
    }

    function add() {
      const v = elInput.value.trim();
      if (!v) return;
      state.active.unshift({ id: uid(), text: v, createdAt: Date.now() });
      elInput.value = ''; save(); render();
    }
    function complete(id) {
      const i = state.active.findIndex(t => t.id === id);
      if (i < 0) return;
      const note = prompt('משימה הושלמה! 🎉\nהערת סגירה (אופציונלי — אפשר להשאיר ריק):', '');
      const t = state.active.splice(i, 1)[0];
      t.doneAt = Date.now(); t.note = (note || '').trim();
      state.done.push(t); save(); render();
    }
    function del(id) {
      if (!confirm('למחוק את המשימה?')) return;
      state.active = state.active.filter(t => t.id !== id); save(); render();
    }
    function restore(id) {
      const i = state.done.findIndex(t => t.id === id);
      if (i < 0) return;
      const t = state.done.splice(i, 1)[0];
      delete t.doneAt; delete t.note;
      state.active.unshift(t); save(); render();
    }

    function onComplete(e) {
      const c = e.target.closest('[data-done]');
      if (!c) return;
      const li = c.closest('.taskItem');
      if (li) { li.classList.add('done'); setTimeout(() => complete(c.dataset.done), 200); }
      else complete(c.dataset.done);
    }
    elPeek.addEventListener('click', onComplete);
    elList.addEventListener('click', (e) => {
      const d = e.target.closest('[data-del]');
      if (d) { del(d.dataset.del); return; }
      onComplete(e);
    });
    elDone.addEventListener('click', (e) => {
      const r = e.target.closest('[data-restore]');
      if (r) restore(r.dataset.restore);
    });
    elAdd.onclick = add;
    elInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    elHead.addEventListener('click', () => {
      elNotes.classList.toggle('collapsed');
      const collapsed = elNotes.classList.contains('collapsed');
      elTgl.textContent = collapsed ? '▼' : '▲';
      localStorage.setItem('rtl-notes-collapsed', collapsed ? '1' : '0');
    });
    elDoneTgl.onclick = () => { elDone.classList.toggle('hidden'); render(); };

    if (localStorage.getItem('rtl-notes-collapsed') === '0') {
      elNotes.classList.remove('collapsed'); elTgl.textContent = '▲';
    }
    render();
    setInterval(setTitle, 60000);   // keep the weekday title fresh across midnight
  })();

  tick();
  setInterval(tick, 1000);
  pollStatus();
  setInterval(pollStatus, 400);   // live working-indicator + streaming text, faster than the 1s tick
  setInterval(animateWork, 110);  // smooth spinner + ticking elapsed time between polls
</script>

<!-- ===== 📋 פנקס-תצוגה (render pad) ===== -->
<div id="padFab" title="פנקס-תצוגה — הדבק טקסט וקבל תצוגה יפה RTL (ללא AI)">📋 פנקס</div>
<div id="pad">
  <div id="padPanel">
    <div id="padBar">
      <span class="title">📋 פנקס-תצוגה</span>
      <span class="spacer"></span>
      <button id="padToggleSrc" title="הסתר/הצג את תיבת-המקור לרוחב-קריאה מלא">🔎 הסתר מקור</button>
      <button id="padCopy" title="העתק את הטקסט המרונדר">📋 העתק</button>
      <button id="padClear" title="נקה הכל">🗑️ נקה</button>
      <button id="padClose" title="סגור (Esc)">✕</button>
    </div>
    <div id="padMain">
      <textarea id="padSrc" placeholder="הדבק כאן טקסט מ-Claude Code (Cmd+V) — התצוגה מימין תתעדכן מיד…"></textarea>
      <div id="padView"><p class="ph">הדבק טקסט משמאל והתצוגה תופיע כאן ✍️</p></div>
    </div>
  </div>
</div>
<script>
  (function () {
    const fab = document.getElementById('padFab');
    const pad = document.getElementById('pad');
    const src = document.getElementById('padSrc');
    const view = document.getElementById('padView');
    const PH = '<p class="ph">הדבק טקסט משמאל והתצוגה תופיע כאן ✍️</p>';
    const escLt = s => (s || '').replace(/</g, '&lt;');   // same guard the chat uses before marked

    function renderPad() {
      const t = src.value;
      if (!t.trim()) { view.innerHTML = PH; return; }
      view.innerHTML = window.marked ? marked.parse(boxToMd(escLt(t)))
                                     : '<pre style="white-space:pre-wrap">' + escLt(t) + '</pre>';
    }
    async function openPad() {
      pad.classList.add('open');
      // grab whatever is on the clipboard so the user doesn't have to paste manually
      try {
        const clip = await navigator.clipboard.readText();
        if (clip && clip.trim()) { src.value = clip; renderPad(); }
      } catch (err) {
        // clipboard blocked (permission / non-secure context) → fall back to manual paste
        view.innerHTML = '<p class="ph">לא הצלחתי לקרוא מהקליפבורד — הדבק ידנית (Cmd+V) והתצוגה תופיע 👈</p>';
      }
      setTimeout(() => src.focus(), 0);
    }
    function closePad() { pad.classList.remove('open'); }

    fab.onclick = openPad;
    document.getElementById('padClose').onclick = closePad;
    pad.addEventListener('click', e => { if (e.target === pad) closePad(); });   // click backdrop = close
    src.addEventListener('input', renderPad);                                   // covers paste + typing

    document.getElementById('padClear').onclick = () => { src.value = ''; renderPad(); src.focus(); };
    document.getElementById('padToggleSrc').onclick = (e) => {
      pad.classList.toggle('hideSrc');
      e.target.textContent = pad.classList.contains('hideSrc') ? '✏️ הצג מקור' : '🔎 הסתר מקור';
    };
    document.getElementById('padCopy').onclick = (e) => {
      const txt = view.innerText.replace(/\n{3,}/g, '\n\n').trim();
      navigator.clipboard.writeText(txt).then(() => {
        const b = e.target; const o = b.textContent; b.textContent = '✓ הועתק';
        setTimeout(() => { b.textContent = o; }, 1200);
      });
    };
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && pad.classList.contains('open')) closePad();
    });
  })();
</script>
</body>
</html>
